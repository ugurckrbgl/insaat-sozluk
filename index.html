    --accent:#ff7252; --accent-strong:#ff8c72; --accent-soft:rgba(255,114,82,.14); --accent-2:#f2ad62;
    --text:#edf2f7; --text-dim:#9eabb8; --positive:#54d68a; --negative:#ff7d7d;
    --shadow-sm:0 1px 2px rgba(0,0,0,.18),0 5px 16px rgba(0,0,0,.16);
    --shadow-lg:0 24px 60px rgba(0,0,0,.45); color-scheme:dark;
  }
  :root[data-theme="dark"] body::before { background:linear-gradient(180deg,#151c25 0%,rgba(13,18,24,0) 100%); }
  :root[data-theme="dark"] header { background:rgba(13,18,24,.9); border-bottom-color:rgba(43,55,68,.9); }
  :root[data-theme="dark"] .nav-link:hover,
  :root[data-theme="dark"] .modal-close { background:#202a35; }
  :root[data-theme="dark"] .btn,
  :root[data-theme="dark"] #search,
  :root[data-theme="dark"] .home-intro,
  :root[data-theme="dark"] .section-card,
  :root[data-theme="dark"] .kat-card,
  :root[data-theme="dark"] .terim-card,
  :root[data-theme="dark"] .forum-item,
  :root[data-theme="dark"] .form-box,
  :root[data-theme="dark"] .comment,
  :root[data-theme="dark"] .modal { background:var(--bg-card); color:var(--text); }
  :root[data-theme="dark"] .btn:hover,
  :root[data-theme="dark"] .kat-card:hover,
  :root[data-theme="dark"] .terim-card:hover,
  :root[data-theme="dark"] .forum-item:hover { background:var(--bg-card-hover); }
  :root[data-theme="dark"] .home-stat,
  :root[data-theme="dark"] .rich-list li,
  :root[data-theme="dark"] .adv-item,
  :root[data-theme="dark"] .form-box input,
  :root[data-theme="dark"] .form-box textarea,
  :root[data-theme="dark"] .form-box select,
  :root[data-theme="dark"] .modal input,
  :root[data-theme="dark"] .modal textarea,
  :root[data-theme="dark"] .modal select { background:#111820; border-color:var(--border); color:var(--text); }
  :root[data-theme="dark"] .form-box input:focus,
  :root[data-theme="dark"] .form-box textarea:focus,
  :root[data-theme="dark"] .form-box select:focus,
  :root[data-theme="dark"] .modal input:focus,
  :root[data-theme="dark"] .modal textarea:focus,
  :root[data-theme="dark"] .modal select:focus { background:#141c25; }
  :root[data-theme="dark"] .rich-intro { color:#cbd4dd; }
  :root[data-theme="dark"] .empty-state { background:rgba(23,30,39,.6); border-color:#354353; }
  :root[data-theme="dark"] footer { background:rgba(13,18,24,.55); }
  .theme-toggle { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-width:42px; }
  .theme-toggle-icon { font-size:1rem; line-height:1; }
  @media (max-width:640px) { .theme-toggle-label { display:none; } }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }

  /* Mobil hamburger menü / soldan açılan panel */
  .menu-toggle { display:none; flex-direction:column; justify-content:center; align-items:center; gap:5px; width:42px; height:42px; padding:0; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; flex-shrink:0; }
  .menu-toggle span { display:block; width:20px; height:2px; border-radius:2px; background:var(--text); transition:transform .25s ease, opacity .2s ease; }
  .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity:0; }
  .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
  .menu-overlay { display:none; position:fixed; inset:0; background:rgba(15,20,26,.45); z-index:90; opacity:0; transition:opacity .2s ease; }
  .menu-overlay.open { display:block; opacity:1; }
  #navBar {
    position:fixed; top:0; left:0; bottom:0; z-index:100; width:min(300px,82vw);
    display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:4px;
    padding:24px 16px; overflow-y:auto; overflow-x:hidden;
    background:#fff; border-right:1px solid var(--border); box-shadow:0 0 40px rgba(16,24,40,.14);
    transform:translateX(-100%); transition:transform .28s ease;
  }
  #navBar.open { transform:translateX(0); }
  #navBar .nav-link,
  #navBar .btn { width:100%; justify-content:flex-start; text-align:left; }
  #navBar .theme-toggle { justify-content:flex-start; }
  #navBar > span { display:block; padding:10px 12px; }
  @media (max-width:900px) {
    .menu-toggle { display:flex; }
    .top-bar nav#navBarDesktop { display:none; }
  }
  @media (min-width:901px) {
    .menu-toggle { display:none; }
    .menu-overlay { display:none !important; }
    #navBar { display:none; }
  }
  :root[data-theme="dark"] .menu-toggle { background:var(--bg-card); }
  :root[data-theme="dark"] .menu-toggle span { background:var(--text); }
  :root[data-theme="dark"] #navBar { background:var(--bg-card); }
</style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="brand" onclick="goHome()" role="button" tabindex="0" aria-label="Ana sayfaya dön">
      <span class="brand-mark">İS</span>
      <span class="brand-copy">İnşaat Sözlüğü<small>Sektörel bilgi platformu</small></span>
    </div>
    <nav id="navBarDesktop" aria-label="Ana menü"></nav>
    <button id="menuToggle" class="menu-toggle" onclick="toggleMobileMenu()" aria-label="Menüyü aç" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="search-wrap" id="searchWrap">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input id="search" type="search" aria-label="Sözlükte terim ara" placeholder="Terim, kategori veya kullanım alanı ara" autocomplete="off">
  </div>
</header>
<div id="menuOverlay" class="menu-overlay" onclick="closeMobileMenu()"></div>
<nav id="navBar" aria-label="Mobil menü"></nav>

<main>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="content">Yükleniyor...</div>
</main>

<footer>İnşaat & Tedarikçi Terimleri Sözlüğü · <span id="termCount"></span> terim · <a href="admin.html" style="color:var(--text-dim)">Yönetim Paneli</a></footer>

<div id="modalRoot"></div>

<script>
const API = "https://insaat-sozluk-api.ugurckrbgl.workers.dev";
let DATA = null;
const state = { view: 'home', bolumKod: null, anaKatKod: null, katKod: null, terimId: null, query: '', forumKonuId: null };
let forumEditCache = { konular: {}, yorumlar: {} };
let currentUser = JSON.parse(localStorage.getItem('sozluk_user') || 'null');
let authToken = localStorage.getItem('sozluk_token') || null;

const contentEl = document.getElementById('content');
const breadcrumbEl = document.getElementById('breadcrumb');
const navBar = document.getElementById('navBar');
const navBarDesktop = document.getElementById('navBarDesktop');

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Bir hata oluştu');
  return data;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function themeControl() {
  const dark = document.documentElement.dataset.theme === 'dark';
  return `<button class="btn theme-toggle" onclick="toggleTheme()" aria-label="${dark ? 'Açık moda geç' : 'Koyu moda geç'}" title="${dark ? 'Açık moda geç' : 'Koyu moda geç'}">
    <span class="theme-toggle-icon" aria-hidden="true">${dark ? '☀' : '☾'}</span>
    <span class="theme-toggle-label">${dark ? 'Açık' : 'Koyu'}</span>
  </button>`;
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('sozluk_theme', next);
  renderNav();
}

function toggleMobileMenu() {
  const isOpen = navBar.classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open', isOpen);
  document.getElementById('menuToggle').setAttribute('aria-expanded', String(isOpen));
  document.body.style.overflow = isOpen ? 'hidden' : '';
}
function closeMobileMenu() {
  navBar.classList.remove('open');
  document.getElementById('menuOverlay').classList.remove('open');
  document.getElementById('menuToggle').setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}

// Aramayı Türkçe büyük/küçük harf ve aksansız yazım farklarına dayanıklı yapar.
// Örnek: "ISI YALITIMI", "ısı yalıtımı" ve "isi yalitimi" aynı sonucu bulabilir.
function normalizeSearchText(value) {
  return String(value ?? '')
    .toLocaleLowerCase('tr-TR')
    .replace(/[çÇ]/g, 'c')
    .replace(/[ğĞ]/g, 'g')
    .replace(/[ıİ]/g, 'i')
    .replace(/[öÖ]/g, 'o')
    .replace(/[şŞ]/g, 's')
    .replace(/[üÜ]/g, 'u')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function terimSearchText(t) {
  const d = t.detay || {};
  const listText = (items) => (items || [])
    .flatMap(item => [item?.baslik, item?.aciklama])
    .filter(Boolean);
  return normalizeSearchText([
    t.terim,
    t.anlam,
    d.giris,
    d.video_baslik,
    ...listText(d.ozellikler),
    ...listText(d.kullanim),
    ...listText(d.avantajlar),
    ...listText(d.dezavantajlar),
  ].filter(Boolean).join(' '));
}

function renderNav() {
  const html = `
    <button class="nav-link ${state.view==='home'||state.view==='bolum'||state.view==='kategori'||state.view==='terim'?'active':''}" onclick="goHome();closeMobileMenu()">Sözlük</button>
    <button class="nav-link ${state.view.startsWith('forum') && state.view!=='forum-benim'?'active':''}" onclick="goForum();closeMobileMenu()">Forum</button>
    ${currentUser ? `
      <button class="nav-link ${state.view==='forum-benim'?'active':''}" onclick="goBenimIceriklerim();closeMobileMenu()">İçeriklerim</button>
      <span style="color:var(--text-dim); font-size:.85rem;">👤 ${esc(currentUser.display_name)}</span>
      <button class="btn" onclick="closeMobileMenu();showHesabimModal()">Hesabım</button>
      ${currentUser.role === 'admin' ? '<a href="admin.html" class="btn">Yönetim Paneli</a>' : ''}
      <button class="btn" onclick="closeMobileMenu();logout()">Çıkış</button>
    ` : `
      <button class="btn" onclick="closeMobileMenu();showLoginModal()">Giriş Yap</button>
      <button class="btn btn-primary" onclick="closeMobileMenu();showRegisterModal()">Kayıt Ol</button>
    `}
    ${themeControl()}
  `;
  navBar.innerHTML = html;
  navBarDesktop.innerHTML = html;
}

let breadcrumbActions = [];
function setBreadcrumb(crumbs) {
  breadcrumbActions = crumbs.map(c => c.action || null);
  breadcrumbEl.innerHTML = crumbs.map((c, i) => {
    const sep = i > 0 ? '<span class="sep">›</span>' : '';
    if (c.action) return `${sep}<span class="crumb" onclick="breadcrumbActions[${i}]()">${esc(c.label)}</span>`;
    return `${sep}<span>${esc(c.label)}</span>`;
  }).join('');
}

// ---------------- SÖZLÜK GEZİNME ----------------
function goHome() {
  state.view = 'home'; state.bolumKod = null; state.anaKatKod = null; state.katKod = null; state.terimId = null; state.query = '';
  document.getElementById('search').value = '';
  document.getElementById('searchWrap').style.display = '';
  render();
}
function goBolum(kod) { state.view = 'bolum'; state.bolumKod = kod; state.anaKatKod = null; state.katKod = null; render(); }
function goAnaKat(bKod, akKod) { state.view = 'anakategori'; state.bolumKod = bKod; state.anaKatKod = akKod; render(); }
function goKat(bKod, kKod, akKod) { state.view = 'kategori'; state.bolumKod = bKod; state.katKod = kKod; state.anaKatKod = akKod || null; render(); }
function goTerim(id) { state.view = 'terim'; state.terimId = id; render(); window.scrollTo(0,0); }

function findBolum(kod) { return DATA.bolumler.find(b => b.kod === kod); }
function findKategoriByKod(kod) {
  for (const b of DATA.bolumler) {
    const kats = b.kategoriler || (b.anaKategoriler || []).flatMap(ak => ak.kategoriler);
    const found = kats.find(k => k.kod === kod);
    if (found) return found;
  }
  return null;
}
function findTerimById(id) {
  for (const b of DATA.bolumler) {
    const kats = b.kategoriler || (b.anaKategoriler || []).flatMap(ak => ak.kategoriler);
    for (const k of kats) {
      const t = k.terimler.find(t => t.id === id);
      if (t) return { terim: t, kategori: k, bolum: b };
    }
  }
  return null;
}

function render() {
  renderNav();
  if (state.query) { renderSearch(); return; }
  if (state.view === 'home') renderHome();
  else if (state.view === 'bolum') renderBolum();
  else if (state.view === 'anakategori') renderAnaKategori();
  else if (state.view === 'kategori') renderKategori();
  else if (state.view === 'terim') renderTerim();
  else if (state.view === 'forum-list') renderForumList();
  else if (state.view === 'forum-detay') renderForumDetay();
  else if (state.view === 'forum-yeni') renderForumYeni();
  else if (state.view === 'forum-benim') renderBenimIceriklerim();
}

function renderHome() {
  setBreadcrumb([{ label: 'Ana Sayfa' }]);
  const icons = { A: '🏗️', B: '📦' };
  let toplam = 0;
  const cards = DATA.bolumler.map(b => {
    const kats = b.kategoriler || (b.anaKategoriler || []).flatMap(ak => ak.kategoriler);
    const terimSayisi = kats.reduce((s, k) => s + k.terimler.length, 0);
    toplam += terimSayisi;
    const katSayisi = kats.length;
    return `<div class="section-card" onclick="goBolum('${b.kod}')">
      <div class="icon">${icons[b.kod] || '📁'}</div>
      <h2>${esc(b.baslik.replace(/^[AB]\)\s*/, ''))}</h2>
      <p>${katSayisi} kategori altında ${terimSayisi} terim</p>
    </div>`;
  }).join('');
  contentEl.innerHTML = `
    <section class="home-intro">
      <div>
        <div class="eyebrow">İnşaat ve tedarik bilgi merkezi</div>
        <h1>Sektörün ortak dilini tek yerde keşfedin.</h1>
        <p>Yapı uygulamalarından malzeme ve tedarik süreçlerine kadar teknik terimlere, kullanım alanlarına ve pratik açıklamalara hızla ulaşın.</p>
      </div>
      <div class="home-stats" aria-label="Sözlük istatistikleri">
        <div class="home-stat"><strong>${toplam}</strong><span>Açıklamalı terim</span></div>
        <div class="home-stat"><strong>${DATA.bolumler.length}</strong><span>Ana bölüm</span></div>
      </div>
    </section>
    <div class="section-heading"><h2>İçerik bölümleri</h2><span>İncelemek istediğiniz alanı seçin</span></div>
    <div class="section-cards">${cards}</div>`;
  document.getElementById('termCount').textContent = toplam;
}

function renderBolum() {
  const b = findBolum(state.bolumKod);
  setBreadcrumb([{ label: 'Ana Sayfa', action: goHome }, { label: b.baslik.replace(/^[AB]\)\s*/, '') }]);
  const backLink = `<div class="back-link" onclick="goHome()">← Ana sayfaya dön</div>`;
  if (b.anaKategoriler) {
    const cards = b.anaKategoriler.map(ak => `
      <div class="kat-card" onclick="goAnaKat('${b.kod}','${ak.kod}')">
        <div class="kod">${esc(ak.kod)}</div>
        <h3>${esc(ak.baslik)}</h3>
        <div class="n">${ak.kategoriler.reduce((s,k)=>s+k.terimler.length,0)} terim</div>
      </div>`).join('');
    contentEl.innerHTML = `${backLink}<div class="kat-grid">${cards}</div>`;
  } else {
    const cards = b.kategoriler.map(k => `
      <div class="kat-card" onclick="goKat('${b.kod}','${k.kod}')">
        <div class="kod">${esc(k.kod)}</div>
        <h3>${esc(k.baslik)}</h3>
        <div class="n">${k.terimler.length} terim</div>
      </div>`).join('');
    contentEl.innerHTML = `${backLink}<div class="kat-grid">${cards}</div>`;
  }
}

function renderAnaKategori() {
  const b = findBolum(state.bolumKod);
  const ak = b.anaKategoriler.find(x => x.kod === state.anaKatKod);
  setBreadcrumb([{ label: 'Ana Sayfa', action: goHome }, { label: b.baslik.replace(/^[AB]\)\s*/, ''), action: () => goBolum(b.kod) }, { label: ak.baslik }]);
  const cards = ak.kategoriler.map(k => `
    <div class="kat-card" onclick="goKat('${b.kod}','${k.kod}','${ak.kod}')">
      <div class="kod">${esc(k.kod)}</div>
      <h3>${esc(k.baslik)}</h3>
      <div class="n">${k.terimler.length} terim</div>
    </div>`).join('');
  contentEl.innerHTML = `<div class="back-link" onclick="goBolum('${b.kod}')">← Geri dön</div><div class="kat-grid">${cards}</div>`;
}

function renderKategori() {
  const b = findBolum(state.bolumKod);
  const k = findKategoriByKod(state.katKod);
  const crumbs = [{ label: 'Ana Sayfa', action: goHome }, { label: b.baslik.replace(/^[AB]\)\s*/, ''), action: () => goBolum(b.kod) }];
  if (state.anaKatKod) {
    const ak = b.anaKategoriler.find(x => x.kod === state.anaKatKod);
    crumbs.push({ label: ak.baslik, action: () => goAnaKat(b.kod, ak.kod) });
  }
  crumbs.push({ label: k.baslik });
  setBreadcrumb(crumbs);
  const geriAction = state.anaKatKod ? `goAnaKat('${b.kod}','${state.anaKatKod}')` : `goBolum('${b.kod}')`;
  const cards = k.terimler.map(t => `
    <div class="terim-card" onclick="goTerim(${t.id})">
      <h4>${esc(t.terim)}</h4>
      <p>${esc(t.anlam)}</p>
    </div>`).join('');
  contentEl.innerHTML = `<div class="back-link" onclick="${geriAction}">← Geri dön</div><div class="terim-grid">${cards}</div>`;
}

function renderTerim() {
  const found = findTerimById(state.terimId);
  if (!found) { contentEl.innerHTML = '<div class="empty-state">Terim bulunamadı.</div>'; return; }
  const { terim: t, kategori: k, bolum: b } = found;
  const crumbs = [{ label: 'Ana Sayfa', action: goHome }, { label: b.baslik.replace(/^[AB]\)\s*/, ''), action: () => goBolum(b.kod) }];
  if (state.anaKatKod) {
    const ak = b.anaKategoriler && b.anaKategoriler.find(x => x.kod === state.anaKatKod);
    if (ak) crumbs.push({ label: ak.baslik, action: () => goAnaKat(b.kod, ak.kod) });
  }
  crumbs.push({ label: k.baslik, action: () => goKat(b.kod, k.kod, state.anaKatKod) });
  crumbs.push({ label: t.terim });
  setBreadcrumb(crumbs);

  const imgSrc = t.gorsel ? (API + '/' + t.gorsel) : '';
  const imgBlock = imgSrc
    ? `<div class="detail-img"><img src="${esc(imgSrc)}" alt="${esc(t.terim)}"></div>`
    : `<div class="detail-img">📷 Görsel eklenmedi</div>`;

  const d = t.detay || {};
  const listBlock = (title, icon, items) => !items || !items.length ? '' : `
    <div class="rich-section"><h3>${icon} ${esc(title)}</h3><ul class="rich-list">
      ${items.map(it => `<li><b>${esc(it.baslik)}</b><span>${esc(it.aciklama)}</span></li>`).join('')}
    </ul></div>`;
  const advBlock = (!d.avantajlar && !d.dezavantajlar) ? '' : `
    <div class="rich-section"><h3>⚖️ Avantajları ve Dezavantajları</h3><div class="adv-grid">
      <div class="adv-col pos"><h4>✓ Avantajlar</h4>${(d.avantajlar||[]).map(a=>`<div class="adv-item"><b>${esc(a.baslik)}</b><span>${esc(a.aciklama)}</span></div>`).join('')}</div>
      <div class="adv-col neg"><h4>✕ Dezavantajlar</h4>${(d.dezavantajlar||[]).map(a=>`<div class="adv-item"><b>${esc(a.baslik)}</b><span>${esc(a.aciklama)}</span></div>`).join('')}</div>
    </div></div>`;
  const videoBlock = d.video_url ? `<div class="rich-section"><h3>▶️ Anlatım Videosu</h3><a href="${esc(d.video_url)}" target="_blank" style="color:var(--accent-2);text-decoration:none;">${esc(d.video_baslik||d.video_url)} ↗</a></div>` : '';

  contentEl.innerHTML = `
    <div class="back-link" onclick="goKat('${b.kod}','${k.kod}','${state.anaKatKod||''}')">← Geri dön</div>
    <div class="detail-panel">
      ${imgBlock}
      <div class="detail-body">
        <div class="kat-tag">${esc(k.kod)} · ${esc(k.baslik)}</div>
        <h2>${esc(t.terim)}</h2>
        ${d.giris ? `<div class="rich-intro">${esc(d.giris)}</div>` : `<div class="rich-intro">${esc(t.anlam)}</div>`}
        ${listBlock('Temel Özellikler', '📋', d.ozellikler)}
        ${listBlock('Kullanım Alanları', '🔧', d.kullanim)}
        ${advBlock}
        ${videoBlock}
      </div>
    </div>
    <div class="rich-section" style="margin-top:24px;">
      <h3>💬 Bu terim hakkında tartışma</h3>
      <button class="btn btn-primary" onclick="startForumFromTerim(${t.id}, '${esc(t.terim).replace(/'/g,"\\'")}')">Bu terim hakkında forum başlığı aç</button>
    </div>
  `;
}

// ---------------- ARAMA ----------------
function renderSearch() {
  setBreadcrumb([{ label: 'Ana Sayfa', action: goHome }, { label: `"${state.query}" için sonuçlar` }]);
  const normalizedQuery = normalizeSearchText(state.query);
  const results = [];
  for (const b of DATA.bolumler) {
    const kats = b.kategoriler || (b.anaKategoriler || []).flatMap(ak => ak.kategoriler);
    for (const k of kats) {
      for (const t of k.terimler) {
        const searchText = `${terimSearchText(t)} ${normalizeSearchText(k.kod)} ${normalizeSearchText(k.baslik)}`;
        if (searchText.includes(normalizedQuery)) {
          results.push({ t, k, b });
        }
      }
    }
  }
  if (!results.length) { contentEl.innerHTML = '<div class="empty-state">Sonuç bulunamadı.</div>'; return; }
  const cards = results.map(({t,k}) => `
    <div class="terim-card" onclick="goTerim(${t.id})">
      <h4>${esc(t.terim)}</h4>
      <p>${esc(t.anlam)}</p>
      <span style="display:block;margin-top:8px;font-size:.7rem;color:var(--accent-2);">${esc(k.kod)} · ${esc(k.baslik)}</span>
    </div>`).join('');
  contentEl.innerHTML = `<div class="terim-grid">${cards}</div>`;
}

document.getElementById('search').addEventListener('input', (e) => {
  state.query = e.target.value.trim();
  render();
});

// ---------------- FORUM ----------------
function goForum() {
  state.view = 'forum-list'; state.query = '';
  document.getElementById('search').value = '';
  render();
}
function goBenimIceriklerim() {
  if (!currentUser) { showLoginModal('İçeriklerinizi görmek için giriş yapmalısınız.'); return; }
  state.view = 'forum-benim'; state.query = '';
  document.getElementById('search').value = '';
  render();
}
function goForumYeni(terimId, terimAdi) {
  state.view = 'forum-yeni'; state.prefillTerim = terimId ? { id: terimId, adi: terimAdi } : null;
  render();
}
function startForumFromTerim(terimId, terimAdi) {
  if (!currentUser) { showLoginModal('Forum başlığı açmak için giriş yapmalısınız.'); return; }
  goForumYeni(terimId, terimAdi);
}
function goForumDetay(id) { state.view = 'forum-detay'; state.forumKonuId = id; render(); }

async function renderForumList() {
  setBreadcrumb([{ label: 'Ana Sayfa', action: goHome }, { label: 'Forum' }]);
  contentEl.innerHTML = '<div class="empty-state">Yükleniyor...</div>';
  try {
    const data = await api('/api/forum/konular');
    const newBtn = currentUser
      ? `<button class="btn btn-primary" onclick="goForumYeni()" style="margin-bottom:16px;">+ Yeni Konu Aç</button>`
      : `<div style="margin-bottom:16px; color:var(--text-dim); font-size:.9rem;">Konu açmak için <span class="crumb" style="color:var(--accent-2);cursor:pointer;" onclick="showLoginModal()">giriş yapın</span>.</div>`;
    if (!data.konular.length) {
      contentEl.innerHTML = newBtn + '<div class="empty-state">Henüz bir forum konusu yok. İlk konuyu sen aç!</div>';
      return;
    }
    const items = data.konular.map(k => `
      <div class="forum-item" onclick="goForumDetay(${k.id})">
        <h4>${esc(k.baslik)}</h4>
        <div class="meta">
          <span class="forum-tag">${esc(k.kategori)}</span>
          <span>👤 ${esc(k.display_name)}${k.uzmanlik_alani ? ' · ' + esc(k.uzmanlik_alani) : ''}</span>
          <span>💬 ${k.yorum_sayisi} yorum</span>
          <span>👁️ ${k.goruntulenme}</span>
        </div>
      </div>`).join('');
    contentEl.innerHTML = newBtn + `<div class="forum-list">${items}</div>`;
  } catch (e) {
    contentEl.innerHTML = `<div class="empty-state">Hata: ${esc(e.message)}</div>`;
  }
}

function forumStatusLabel(status) {
  const labels = { yayinda: 'Yayında', onay_bekliyor: 'Onay bekliyor', reddedildi: 'Reddedildi', kapatildi: 'Kapatıldı' };
  return labels[status] || status;
}

function showKonuEditModal(id) {
  const k = forumEditCache.konular[id];
  if (!k) return;
  const kategoriler = [
    ['genel', 'Genel Tartışma'], ['soru', 'Soru'],
    ['uzmanlik-paylasimi', 'Uzmanlık Paylaşımı'], ['urun-tanitim', 'Ürün / Hizmet Tanıtımı']
  ];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">
      <span class="modal-close" onclick="closeModal()">✕</span><h3>Konuyu Düzenle</h3>
      <div class="error-msg" id="forumEditErr" style="display:none;"></div>
      <label>Kategori</label><select id="editKonuKategori">${kategoriler.map(([v,l])=>`<option value="${v}" ${k.kategori===v?'selected':''}>${l}</option>`).join('')}</select>
      <label>Başlık</label><input id="editKonuBaslik" value="${esc(k.baslik)}">
      <label>İçerik</label><textarea id="editKonuIcerik">${esc(k.icerik)}</textarea>

      <button class="btn btn-primary" style="width:100%;" onclick="saveForumKonu(${id})">Kaydet</button>
    </div></div>`;
}

async function saveForumKonu(id) {
  const body = {
    kategori: document.getElementById('editKonuKategori').value,
    baslik: document.getElementById('editKonuBaslik').value.trim(),
    icerik: document.getElementById('editKonuIcerik').value.trim(),
  };
  const errEl = document.getElementById('forumEditErr');
  if (!body.baslik || !body.icerik) { errEl.textContent = 'Başlık ve içerik zorunludur.'; errEl.style.display = 'block'; return; }
  try {
    const result = await api(`/api/forum/konular/${id}`, { method:'PUT', body:JSON.stringify(body) });
    closeModal(); alert(result.message); goBenimIceriklerim();
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

function showYorumEditModal(id) {
  const y = forumEditCache.yorumlar[id];
  if (!y) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">
      <span class="modal-close" onclick="closeModal()">✕</span><h3>Yorumu Düzenle</h3>
      <div class="error-msg" id="forumEditErr" style="display:none;"></div>
      <label>Yorum</label><textarea id="editYorumIcerik">${esc(y.icerik)}</textarea>
      ${currentUser.role === 'admin' ? '' : '<div style="color:var(--text-dim);font-size:.8rem;margin-bottom:12px;">Değişiklikler yeniden yönetici onayına gönderilir.</div>'}
      <button class="btn btn-primary" style="width:100%;" onclick="saveForumYorum(${id})">Kaydet</button>
    </div></div>`;
}

async function saveForumYorum(id) {
  const icerik = document.getElementById('editYorumIcerik').value.trim();
  const errEl = document.getElementById('forumEditErr');
  if (!icerik) { errEl.textContent = 'Yorum içeriği zorunludur.'; errEl.style.display = 'block'; return; }
  try {
    const result = await api(`/api/forum/yorumlar/${id}`, { method:'PUT', body:JSON.stringify({ icerik }) });
    closeModal(); alert(result.message); goBenimIceriklerim();
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

async function deleteForumKonu(id) {
  if (!confirm('Bu konuyu ve konuya yazılmış tüm yorumları kalıcı olarak silmek istediğinize emin misiniz?')) return;
  try { await api(`/api/forum/konular/${id}`, { method:'DELETE' }); alert('Konu silindi.'); goBenimIceriklerim(); }
  catch (e) { alert('Hata: ' + e.message); }
}

async function deleteForumYorum(id) {
  if (!confirm('Bu yorumu kalıcı olarak silmek istediğinize emin misiniz?')) return;
  try { await api(`/api/forum/yorumlar/${id}`, { method:'DELETE' }); alert('Yorum silindi.'); goBenimIceriklerim(); }
  catch (e) { alert('Hata: ' + e.message); }
}

  try {
    const data = await api('/api/forum/konular/' + state.forumKonuId);
    forumEditCache.konular[data.konu.id] = data.konu;
    data.yorumlar.forEach(y => { forumEditCache.yorumlar[y.id] = y; });
    const yorumlar = data.yorumlar.map(y => {
      const canManage = currentUser && (currentUser.id === y.user_id || currentUser.role === 'admin');
      return `
      <div class="comment">
        <div class="meta">👤 ${esc(y.display_name)}${y.uzmanlik_alani ? ' · '+esc(y.uzmanlik_alani) : ''} · ${new Date(y.created_at).toLocaleString('tr-TR')}</div>

        ${canManage ? `<div class="content-actions"><button class="btn" onclick="showYorumEditModal(${y.id})">Düzenle</button><button class="btn" onclick="deleteForumYorum(${y.id})" style="color:var(--negative);">Sil</button></div>` : ''}
      </div>`;
    }).join('') || '<div style="color:var(--text-dim);">Henüz yorum yok.</div>';

      <div class="form-box">
        <label>Yorumunuz</label>

    contentEl.innerHTML = `
      <div class="back-link" onclick="goForum()">← Foruma dön</div>

        <h2>${esc(data.konu.baslik)}</h2>
        <div style="color:var(--text-dim); font-size:.85rem; margin-bottom:16px;">👤 ${esc(data.konu.display_name)}${data.konu.uzmanlik_alani ? ' · '+esc(data.konu.uzmanlik_alani) : ''} · ${new Date(data.konu.created_at).toLocaleString('tr-TR')}</div>
        <div class="rich-intro">${esc(data.konu.icerik)}</div>
        ${canManageKonu ? `<div class="content-actions"><button class="btn" onclick="showKonuEditModal(${data.konu.id})">Düzenle</button><button class="btn" onclick="deleteForumKonu(${data.konu.id})" style="color:var(--negative);">Sil</button></div>` : ''}

      <div class="rich-section" style="margin-top:24px;">
        <h3>💬 Yorumlar (${data.yorumlar.length})</h3>
        ${yorumlar}
        ${yorumForm}
      </div>
    `;
  } catch (e) {
    contentEl.innerHTML = `<div class="empty-state">Hata: ${esc(e.message)}</div>`;
  }
}

async function postYorum(konuId) {
  const icerik = document.getElementById('yorumIcerik').value.trim();
  if (!icerik) return;
  try {
    await api(`/api/forum/konular/${konuId}/yorum`, { method: 'POST', body: JSON.stringify({ icerik }) });
    alert('Yorumunuz gönderildi, yönetici onayından sonra yayınlanacaktır.');
    renderForumDetay();
  } catch (e) { alert('Hata: ' + e.message); }
}

async function submitForumYeni(terimId) {
  const baslik = document.getElementById('fBaslik').value.trim();
  const icerik = document.getElementById('fIcerik').value.trim();
  const kategori = document.getElementById('fKategori').value;
  if (!baslik || !icerik) { alert('Başlık ve içerik zorunludur.'); return; }
  try {
    await api('/api/forum/konular', { method: 'POST', body: JSON.stringify({ baslik, icerik, kategori, terim_id: terimId }) });
    alert('Konunuz gönderildi, yönetici onayından sonra yayınlanacaktır.');
    goForum();

function showLoginModal(msg) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <span class="modal-close" onclick="closeModal()">✕</span>
        <h3>Giriş Yap</h3>
        ${msg ? `<div style="color:var(--text-dim); font-size:.85rem; margin-bottom:12px;">${esc(msg)}</div>` : ''}
        <div class="error-msg" id="loginErr" style="display:none;"></div>
        <input id="loginEmail" type="email" placeholder="E-posta">
        <input id="loginPass" type="password" placeholder="Şifre">
        <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Giriş Yap</button>
        <div style="text-align:center; margin-top:12px; font-size:.85rem; color:var(--text-dim);">
          Hesabın yok mu? <span style="color:var(--accent-2);cursor:pointer;" onclick="showRegisterModal()">Kayıt ol</span>
        </div>
      </div>
    </div>`;
}
function showRegisterModal() {
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <span class="modal-close" onclick="closeModal()">✕</span>
        <h3>Kayıt Ol</h3>
        <div class="error-msg" id="regErr" style="display:none;"></div>
        <input id="regName" type="text" maxlength="100" autocomplete="name" placeholder="Ad Soyad">
        <input id="regEmail" type="email" maxlength="254" autocomplete="email" placeholder="E-posta">
        <input id="regPass" type="password" minlength="6" maxlength="128" autocomplete="new-password" placeholder="Şifre (en az 6 karakter)">
        <input id="regUzmanlik" type="text" maxlength="150" placeholder="Uzmanlık alanınız (opsiyonel, örn: Elektrik Taahhüt)">
        <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">Kayıt Ol</button>
        <div style="text-align:center; margin-top:12px; font-size:.85rem; color:var(--text-dim);">
          Zaten hesabın var mı? <span style="color:var(--accent-2);cursor:pointer;" onclick="showLoginModal()">Giriş yap</span>
        </div>
      </div>
    </div>`;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('sozluk_token', authToken);
    localStorage.setItem('sozluk_user', JSON.stringify(currentUser));
    closeModal(); render();
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}
async function doRegister() {
  const display_name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPass').value;
  const uzmanlik_alani = document.getElementById('regUzmanlik').value.trim();
  const errEl = document.getElementById('regErr');
  errEl.style.display = 'none';
  if (!display_name || !email || !password) {
    errEl.textContent = 'Ad, e-posta ve şifre zorunludur.'; errEl.style.display = 'block'; return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || email.includes('..')) {
    errEl.textContent = 'Geçerli bir e-posta adresi girin.'; errEl.style.display = 'block'; return;
  }
  if (password.length < 6 || password.length > 128) {
    errEl.textContent = 'Şifre 6–128 karakter arasında olmalıdır.'; errEl.style.display = 'block'; return;
  }
  try {
    const data = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ display_name, email, password, uzmanlik_alani }) });
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('sozluk_token', authToken);
    localStorage.setItem('sozluk_user', JSON.stringify(currentUser));
    closeModal(); render();
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}
async function logout() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
  authToken = null; currentUser = null;
  localStorage.removeItem('sozluk_token'); localStorage.removeItem('sozluk_user');
  goHome();
}

async function doSifreDegistir() {
  const eski = document.getElementById('sEski').value;
  const yeni1 = document.getElementById('sYeni1').value;
  const yeni2 = document.getElementById('sYeni2').value;
  const errEl = document.getElementById('sifreErr');
  errEl.style.display = 'none';
  if (!eski || !yeni1 || !yeni2) { errEl.textContent = 'Tüm alanları doldurun.'; errEl.style.display = 'block'; return; }
  if (yeni1 !== yeni2) { errEl.textContent = 'Yeni şifreler eşleşmiyor.'; errEl.style.display = 'block'; return; }
  try {
    const result = await api('/api/auth/sifre-degistir', { method: 'POST', body: JSON.stringify({ eski_sifre: eski, yeni_sifre: yeni1 }) });
    alert(result.message || 'Şifreniz başarıyla değiştirildi.');
    closeModal();
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

async function yukleOturumlar() {
  try {
    const data = await api('/api/auth/oturumlar');
    const el = document.getElementById('oturumListesi');
    if (!el) return;
    if (!data.oturumlar.length) { el.textContent = 'Aktif oturum bulunamadı.'; return; }
    el.innerHTML = data.oturumlar.map(o => `
      <div style="padding:8px 0; border-bottom:1px solid var(--border);">
        ${o.bu_cihaz ? '🟢 Bu cihaz' : '⚪ Başka cihaz'} · ...${esc(o.kimlik)}
        <div style="font-size:.75rem;">${new Date(o.created_at).toLocaleString('tr-TR')}</div>
      </div>`).join('');
  } catch (e) {
    const el = document.getElementById('oturumListesi');
    if (el) el.textContent = 'Hata: ' + e.message;
  }
}

async function kapatDigerCihazlar() {
  if (!confirm('Bu cihaz dışındaki tüm oturumlar kapatılacak. Devam edilsin mi?')) return;
  try {
    const result = await api('/api/auth/oturumlar/diger-cihazlari-kapat', { method: 'POST' });
    alert(`${result.kapatilan} oturum kapatıldı.`);
    yukleOturumlar();
  } catch (e) { alert('Hata: ' + e.message); }
}

// ---------------- BAŞLANGIÇ ----------------
async function init() {
  try {
    DATA = await api('/api/sozluk');
    render();
  } catch (e) {
    contentEl.innerHTML = `<div class="empty-state">Veri yüklenemedi: ${esc(e.message)}</div>`;
  }
}
init();
</script>
